plugins { id 'com.android.application' }
android {
    namespace 'com.routeviewer.maplibre'
    lint {
    abortOnError false
}
    compileSdk 35
    defaultConfig {
        applicationId 'com.routeviewer.maplibre'
        minSdk 26
        targetSdk 28
        versionCode 24
        versionName "1.4.22"
    }
    signingConfigs {
        persistent {
            def keyPath = System.getenv('SIGNING_KEYSTORE_PATH')
            def password = System.getenv('SIGNING_PASSWORD')
            if (keyPath && password) {
                storeFile file(keyPath)
                storePassword password
                keyAlias 'routeviewer'
                keyPassword password
                storeType 'pkcs12'
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.persistent
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'org.locationtech.jts:jts-core:1.20.0'
    implementation 'org.maplibre.gl:android-sdk-opengl:13.7.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
