name: Build MapLibre Route Viewer (persistent signing)
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - '*.gradle'
      - 'gradle.properties'
      - 'settings.gradle'
      - '.github/workflows/build-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore private signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$SIGNING_PASSWORD" ]; then
            echo "Missing SIGNING_KEYSTORE_BASE64 or SIGNING_PASSWORD repository secret"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/routeviewer.p12"
          chmod 600 "$RUNNER_TEMP/routeviewer.p12"
      - name: Build signed release APK
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/routeviewer.p12
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: gradle --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: MapLibreRouteViewer-signed-release-apk
          path: app/build/outputs/apk/release/*.apk
